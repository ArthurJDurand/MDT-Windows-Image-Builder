name: 💡 Feature Request
description: Suggest a new workflow, script, template, or improvement
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
assignees:
  - ArthurJDurand

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement. Before submitting, please:

        1. **Search [existing issues](https://github.com/ArthurJDurand/MDT-Windows-Image-Builder/issues)** and **[Discussions](https://github.com/ArthurJDurand/MDT-Windows-Image-Builder/discussions)** to avoid duplicates.
        2. **Check the [CONTRIBUTING.md → Areas Where Help Is Needed](https://github.com/ArthurJDurand/MDT-Windows-Image-Builder/blob/main/CONTRIBUTING.md#areas-where-help-is-needed)** section — your idea may already be on the roadmap.
        3. **Review the README** to understand the current scope and intended audience.

        For open-ended ideas or brainstorming, please start a **[Discussion](https://github.com/ArthurJDurand/MDT-Windows-Image-Builder/discussions)** instead of an issue.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      description: Please confirm you have completed these steps before filing.
      options:
        - label: I have searched existing issues and Discussions, and this has not been suggested before.
          required: true
        - label: I have read the CONTRIBUTING.md "Areas Where Help Is Needed" section.
          required: true
        - label: I have read the README and understand what this project does and does not cover.
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature category
      description: What type of feature are you requesting?
      options:
        - New workflow step or approach
        - New script (ISO build, DISM, capture, and so on)
        - New autounattend template
        - New documentation page
        - Support for a new Windows version
        - Support for a new hypervisor or build environment
        - Alternative image-building approach (no UUPDump, no audit mode)
        - Image maintenance workflow (refresh, update, patch)
        - Build, CI, or repository infrastructure
        - Refactor or code quality
        - Other (specify in Description)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Describe the pain point, not the solution.
      placeholder: |
        Example: Building the ISO with UUPDump requires a GUI browser and manual
        steps. When I need to rebuild the image every quarter, I have to repeat
        the same process from memory and I sometimes forget the .NET 3.5 option.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen? Be as specific as you can.
      placeholder: |
        Example: Add a PowerShell script that takes a UUPDump build ID and
        automates the download, extraction, and build. The script should also
        verify the .NET 3.5 checkbox was selected before starting the build.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider? Why did you reject them?
      placeholder: |
        Example: I considered wrapping the UUPDump batch file directly, but it
        does not return useful exit codes and cannot be scripted reliably.
        Writing a fresh script that uses the same UUPDump API is more work
        but yields a better result.
    validations:
      required: false

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe your scenario. What are you building, and how often?
      placeholder: |
        - Target OS: Windows 11 Pro x64 24H2
        - Build environment: Windows 11 Pro host with Hyper-V
        - Frequency: quarterly image refresh
        - Downstream: images imported into MDT for zero-touch deployment
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples, references, or mockups
      description: |
        Links to other projects, scripts, blog posts, or code sketches that
        demonstrate what you have in mind. If you have a working prototype,
        share it.
      placeholder: |
        Example: This blog post describes a similar workflow:
        https://example.com/windows-image-automation
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to contribute
      description: This project is maintained by a single person in their spare time. Contributions are very welcome.
      options:
        - label: I am willing to submit a pull request implementing this feature.
          required: false
        - label: I am willing to test a proposed implementation on real hardware or a VM.
          required: false
        - label: I am willing to help with documentation for this feature.
          required: false
        - label: I would only like to see this feature implemented (no contribution planned).
          required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help evaluate this request.
    validations:
      required: false
